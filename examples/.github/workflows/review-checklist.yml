# Posts your team's code review checklist as a comment on each new pull request.
# Copy this file to .github/workflows/review-checklist.yml, and copy checklist.md
# from Winding-Labs/code-review-checklist to .github/review-checklist.md.
#
# pull_request_target lets it comment on pull requests from forks. It never checks
# out or runs the pull request's code: it reads the checklist from the base branch
# through the API. Keep it that way if you edit it.
#
# MIT License. https://github.com/Winding-Labs/code-review-checklist

name: Review checklist

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  post-checklist:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CHECKLIST_PATH: .github/review-checklist.md
        with:
          script: |
            const marker = '<!-- code-review-checklist -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            if (comments.some((c) => (c.body || '').includes(marker))) {
              core.info('Checklist already posted.');
              return;
            }

            let checklist;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: process.env.CHECKLIST_PATH, ref: pr.base.ref,
              });
              checklist = Buffer.from(data.content, 'base64').toString('utf8');
            } catch (error) {
              core.setFailed(`Could not read ${process.env.CHECKLIST_PATH} on ${pr.base.ref}: ${error.message}`);
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `${marker}\n${checklist}`,
            });
